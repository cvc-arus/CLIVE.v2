# smartd configuration for the CLIVE host. Installed to /etc/smartd.conf
# (Ubuntu's original kept as /etc/smartd.conf.orig); see docs/installation.md
# section 9 and docs/recovery-plan.md section 9.
#
# Both disks are Crucial MX500 250 GB SATA SSDs, named by stable ID because
# sdX names can change between boots:
#   ...<disk-id-suffix> = sda: / (OS, repository, backups in <home>/clive-backups)
#   ...<disk-id-suffix> = sdb: /data (all live CLIVE data)
#
# Warnings go to the journal only (journalctl -u smartd): there is no mail
# setup on the host. Email alerts are deferred to monitoring (roadmap Phase 10).
#
# -a          all health, attribute, error-log and self-test-log checks
# -o on       automatic offline data collection
# -S on       attribute autosave
# -s ...      short self-test daily at 03:00 (after the 02:30 backup); long
#             self-test Saturdays at 04:00 (clear of Sunday's 03:10 e2scrub)
# -W 4,55,65  log a 4 C temperature change, log at 55 C, critical at 65 C

/dev/disk/by-id/<disk-by-id> -a -o on -S on -s (S/../.././03|L/../../6/04) -W 4,55,65
/dev/disk/by-id/<disk-by-id> -a -o on -S on -s (S/../.././03|L/../../6/04) -W 4,55,65
